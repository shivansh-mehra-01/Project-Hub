# Production Docker Compose Example — Colabex / Project Hub
# Copy to docker-compose.prod.yml and supply secrets via environment file (.env.prod) or secret manager.
# Never commit real secrets to source control.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-projecthub_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-projecthub_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/src/ProjectHub.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5000
      # Runtime connection MUST use colabex_rls_app (NOSUPERUSER, NOBYPASSRLS)
      ConnectionStrings__DefaultConnection: ${RUNTIME_CONNECTION_STRING:?RUNTIME_CONNECTION_STRING is required}
      Redis__ConnectionString: redis:6379,password=${REDIS_PASSWORD}
      Jwt__Secret: ${JWT_SECRET:?JWT_SECRET is required}
      Jwt__Issuer: ${JWT_ISSUER:?JWT_ISSUER is required}
      Jwt__Audience: ${JWT_AUDIENCE:?JWT_AUDIENCE is required}
      Jwt__ExpiryMinutes: 15
      DataProtection__KeysPath: /app/App_Data/dpkeys
      Frontend__BaseUrl: ${FRONTEND_BASE_URL:?FRONTEND_BASE_URL is required}
      Cors__AllowedOrigins__0: ${FRONTEND_BASE_URL}
      # IMPORTANT: The API's direct peer is the Next.js BFF container on the internal Docker network,
      # NOT the edge reverse proxy. Configure KnownNetworks to match your Docker subnet (or KnownProxies to Next.js IP).
      ForwardedHeaders__KnownNetworks__0: ${INTERNAL_DOCKER_SUBNET:-172.16.0.0/12}
      Email__Provider: Smtp
      Email__SmtpHost: ${SMTP_HOST:?SMTP_HOST is required}
      Email__SmtpPort: ${SMTP_PORT:-587}
      Email__SmtpUser: ${SMTP_USER:?SMTP_USER is required}
      Email__SmtpPassword: ${SMTP_PASSWORD:?SMTP_PASSWORD is required}
      Email__FromAddress: ${SMTP_FROM_ADDRESS:?SMTP_FROM_ADDRESS is required}
    volumes:
      - vault_data:/app/App_Data/vault
      - dp_keys:/app/App_Data/dpkeys
    # Do NOT publish port 5000 publicly in production; only Next.js BFF calls it over the internal network.
    expose:
      - "5000"

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      BACKEND_API_URL: http://api:5000
      NEXT_PUBLIC_API_URL: http://api:5000
    # Do NOT expose Next.js directly to the internet; traffic must enter through the TLS reverse proxy.
    expose:
      - "3000"

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./backend/deploy/nginx/colabex.conf.example:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro

volumes:
  postgres_data:
  redis_data:
  vault_data:
  dp_keys:
